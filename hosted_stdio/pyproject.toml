[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfy-sales-demo-stdio"
version = "0.1.0"
description = "Read-only MCP demo for querying deterministic fictional sales data over STDIO."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "HongKe Demo" }]
dependencies = [
  "fastmcp==4.0.4",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.urls]
Repository = "https://github.com/BluesyJ/tfy-sales-demo-stdio"

[project.scripts]
tfy-sales-demo = "tfy_sales_demo.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tfy_sales_demo = ["data/*.json"]
